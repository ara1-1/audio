<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Audio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        main {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            margin-bottom: 20px;
            font-size: 24px;
        }
        audio {
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <main>
        <!-- Cambia esto por el título de tu tema -->
        <h1>Título del Tema</h1> 
        
        <!-- Cambia "audio.mp3" por el nombre exacto de tu archivo de música -->
        <audio controls>
            <source src="audio.mp3" type="audio/mpeg">
            Tu navegador no soporta el elemento de audio.
        </audio>
    </main>

</body>
</html>
